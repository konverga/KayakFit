name: Bug Report
description: Report a problem with KayakFit
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug!

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened? What did you expect to happen instead?
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating System
      placeholder: "e.g. macOS 15.2, Windows 11"
    validations:
      required: true

  - type: input
    id: python-version
    attributes:
      label: Python version
      placeholder: "e.g. 3.14.5"
    validations:
      required: false

  - type: input
    id: device
    attributes:
      label: Ergometer / firmware version
      placeholder: "e.g. KayakFirst Bull, firmware X.Y"
    validations:
      required: false

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Paste logs from the app logger, if available. This will be auto-formatted as code.
      render: shell
    validations:
      required: false
